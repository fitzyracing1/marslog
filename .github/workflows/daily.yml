name: daily
on:
  schedule: [{cron: "17 9 * * *"}]
  workflow_dispatch:
    inputs:
      backfill: {description: "sols back from latest to ensure cached", default: "10"}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: daily, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Heat report (start sampling)
        uses: fitzyracing1/heatgate@f766e4460f6468852c117c74dd83dfcf19cdb849  # heat-report-action (fitzyracing1/heatgate#2); switch to a tag once merged
        continue-on-error: true
        with: {mode: start, interval: "5"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Fetch new sols
        run: python -m marslog.fetch --backfill "${{ github.event.inputs.backfill || '10' }}" --refresh 4 --budget 1800
      - name: Fetch traverse (MMGIS waypoints)
        run: python -m marslog.traverse
      - name: Build changes + site
        run: python -m marslog.build && mkdir -p site/data && cp -r data/* site/data/ && touch site/.nojekyll
      - name: Study smoke test
        run: pip install -q pandas matplotlib && python study/study.py && pip install -q numpy && python study/traverse_study.py > /dev/null
      - name: Heat model (retrain + predict)
        run: pip install -q scikit-learn pandas numpy && python -m marslog.heat train > /dev/null && python -m marslog.heat predict --sol 5100 && test -s site/heat.json
      - name: Commit cache
        run: |
          git config user.name "marslog-bot"; git config user.email "actions@users.noreply.github.com"
          git add data && (git diff --cached --quiet || (git commit -qm "data: $(date -u +%F)" && git push))
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - name: Heat report (summary)
        if: always()
        uses: fitzyracing1/heatgate@f766e4460f6468852c117c74dd83dfcf19cdb849  # heat-report-action (fitzyracing1/heatgate#2); switch to a tag once merged
        continue-on-error: true
        with: {mode: stop, artifact: heat-report}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
