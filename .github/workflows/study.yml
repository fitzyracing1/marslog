name: study
on: {pull_request: {paths: ["study/**", "data/**"]}, workflow_dispatch: {}}
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas matplotlib numpy && python study/study.py && python study/deep_study.py > /dev/null && ls study/out/deep
