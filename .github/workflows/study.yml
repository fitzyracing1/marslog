name: study
on: {pull_request: {paths: ["study/**", "data/**", "marslog/**", ".github/workflows/**"]}, workflow_dispatch: {}}
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q pandas matplotlib numpy && python study/study.py && python study/deep_study.py > /dev/null && python study/traverse_study.py && ls study/out/deep study/out/traverse && pip install -q scikit-learn && python -m marslog.heat train > /dev/null && python -m marslog.heat predict --sol 5100 && test -s site/heat.json
